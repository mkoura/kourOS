---
name: Build workstation container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '11 11 * * *'  # 11:11am UTC everyday
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_image:
    uses: ./.github/workflows/build_reusable.yml
    secrets: inherit
    with:
      image_flavor: workstation
