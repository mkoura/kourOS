---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - amd64
          - arm64
      image-flavor:
        description: "Image flavor"
        required: true
        type: choice
        options:
          - laptop
          - workstation
          - silverblue
      disk-type:
        description: "Disk image type"
        required: true
        type: choice
        default: both
        options:
          - both
          - anaconda-iso
          - qcow2
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml.in'
      - './.github/workflows/build-disk.yml'

env:
  # IMAGE_NAME and BIB_IMAGE come from kouros.env, the same file the Justfile
  # and build_reusable.yml read. See the "Resolve image config" step below.
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG:  ${{ inputs.image-flavor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.disk-type }}
    # Deliberately 24.04 while the container builds run on 26.04. On 26.04
    # bootc-image-builder's osbuild stage fails to set up its build root:
    # chown returns EPERM across the tree and mounting /dev into it returns
    # EACCES, as though the stage is not running as real root. podman's
    # --privileged does disable AppArmor, SELinux and seccomp, so that is not
    # the cause, and no bootc-image-builder issue reports it. 24.04 is the
    # runner their GitHub Actions guidance is written against.
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        # A dispatch builds the selected type, or both. Pull requests have no
        # input and get both, so a change to either config is still validated.
        disk-type: ${{ fromJSON(inputs.disk-type == 'qcow2' && '["qcow2"]' || inputs.disk-type == 'anaconda-iso' && '["anaconda-iso"]' || '["qcow2","anaconda-iso"]') }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          set -euo pipefail
          {
            # Lowercase the image uri
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "${GITHUB_ENV}"

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Resolve image config
        run: |
          set -euo pipefail
          # kouros.env is the single source of truth, shared with the Justfile
          # and with build_reusable.yml.
          IMAGE_NAME="$(just image-name)"
          # ghcr.io rejects uppercase paths.
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "BIB_IMAGE=$(just bib-image)" >> "$GITHUB_ENV"
          echo "BIB_ROOTFS=$(just bib-rootfs)" >> "$GITHUB_ENV"

      # The installer kickstart repoints the installed system at the image it
      # should pull updates from, which differs per flavor, so it is rendered
      # from disk_config/iso.toml.in rather than kept as a static file.
      - name: Render installer config
        if: matrix.disk-type == 'anaconda-iso'
        run: just iso-config "$DEFAULT_TAG" "$IMAGE_REGISTRY"

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.generated.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          rootfs: ${{ env.BIB_ROOTFS }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail

          # Fail loudly rather than copying to a bucketless "S3:" target if
          # the secret was never configured.
          if [ -z "${S3_BUCKET_NAME}" ]; then
            echo "S3_BUCKET_NAME secret is not set" >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y rclone

          rclone copy "${SOURCE_DIR}" "S3:${S3_BUCKET_NAME}"
