---
name: Reusable container image build
on:
  workflow_call:
    inputs:
      image_flavor:
        type: string

env:
  IMAGE_DESC: "kourOS Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,bluefin"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # Output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # Do not edit
  DEFAULT_TAG: "${{ inputs.image_flavor || 'laptop' }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.image_flavor || 'laptop' }}-${{ github.ref }}
  # Supersede PR builds, but never interrupt a run on the default branch: a
  # cancel landing between push and sign would leave unsigned tags published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_push:
    name: Build and push ${{ inputs.image_flavor || 'laptop' }} image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preprocess Containerfile.in
        run: cpp -P -DCPP_"$DEFAULT_TAG" Containerfile.in -o Containerfile

      - name: Install skopeo and jq
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if ! { command -v jq && command -v skopeo; } >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo jq
          fi

      - name: Get current repo and base image commit
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: current_state
        run: |
          # pipefail matters here: without it a skopeo failure is masked by the
          # exit status of the jq it is piped into.
          set -euo pipefail

          git_commit="$(git rev-parse HEAD)"
          echo "git_commit=$git_commit" >> "$GITHUB_OUTPUT"

          # Take the last matching FROM. Picking the first would silently
          # inspect the wrong image if a ghcr-based helper stage is ever added
          # above the base image.
          base_image="$(grep -E '^FROM ghcr\.io' ./Containerfile | tail -n1 | awk '{print $2}')"
          echo "Base image: $base_image"

          # '// empty' is load-bearing: plain 'jq -r' prints the literal string
          # "null" for a missing label, which would sail past the check below
          # and get cached as base_commit="null". That value never changes, so
          # every later run would see "no base image change" and skip forever.
          ostree_commit="$(skopeo inspect "docker://$base_image" |
            jq -r '.Labels["org.centos.stream.ostree.commit"] // .Labels["ostree.commit"] // empty')"

          if [ -z "$ostree_commit" ]; then
            echo "❌ Failed to extract OSTree commit from base image: $base_image"
            exit 1
          fi

          echo "ostree_commit=$ostree_commit" >> "$GITHUB_OUTPUT"

          # INTENTIONAL: the cache key covers the base image only, not the git
          # commit. Scheduled runs exist to pick up base image updates; edits
          # made in this repo are published by triggering the build manually
          # (workflow_dispatch always builds, see the decision step below).
          # To also rebuild on every repo change, add git_commit to this file.
          echo "{\"base_commit\": \"$ostree_commit\"}" > .curr-base-commit.json

      - name: Restore last build state
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: cache_restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .last-build-info.json
          key: build-state-${{ inputs.image_flavor || 'laptop' }}-${{ hashFiles('.curr-base-commit.json') }}

      - name: Check if skipping build and/or publish
        id: should_build_publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_GIT: ${{ steps.current_state.outputs.git_commit }}
          CURRENT_BASE: ${{ steps.current_state.outputs.ostree_commit }}
        run: |
          set -euo pipefail

          # Determine if we're on the default branch (and not a pull request).
          default_branch=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && \
             [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            default_branch=true
          fi

          # Report the restored state against the current one.
          if [ -f .last-build-info.json ]; then
            echo "Last Git:  $(jq -r .git_commit < .last-build-info.json)"
            echo "Current:   $CURRENT_GIT"
            echo "Last Base: $(jq -r .base_commit < .last-build-info.json)"
            echo "Current:   $CURRENT_BASE"
          fi

          # Decide whether to build.

          # Always build when triggered manually.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            should_build=true
            echo "📦 Manual trigger detected – building."
          # Always build for pull requests or non-default branches.
          elif [ "$default_branch" != "true" ]; then
            should_build=true
            echo "📦 Building for PR or non-default branch."
          # On the default branch, build only if the base image has changed.
          elif [ -f .last-build-info.json ]; then
            should_build=false
            echo "✅ No base image changes detected – skipping build."
          else
            should_build=true
            echo "📦 Base image changed, or no cached build state – building."
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

          # Decide whether to publish.

          # Skip publish if we’re not building.
          if [ "$should_build" != "true" ]; then
            should_publish=false
            echo "🙅‍♂️ Skipping publish – nothing will be built."
          # Publish only if building from the default branch.
          elif [ "$default_branch" = "true" ]; then
            should_publish=true
            echo "📤 Publishing – build from default branch."
          else
            should_publish=false
            echo "🙅‍♂️ Skipping publish – not on default branch."
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      # This is optional, but if you see that your builds are way too big for the runners, you can enable this by uncommenting the following lines:
      - name: Maximize build space
        if: steps.should_build_publish.outputs.should_build == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        if: steps.should_build_publish.outputs.should_build == 'true'
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        if: steps.should_build_publish.outputs.should_build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile.in
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        if: steps.should_build_publish.outputs.should_build == 'true'
        id: build_image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          containerfiles: |
            ./Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: true

      # NOT ENABLED - kept as a reminder that rechunking is an option.
      #
      # Rechunking splits the image so it isn't published as one huge layer. It
      # doesn't make downloads faster, it makes updates smaller and resumable.
      #
      # The block below is the old hhd-dev/rechunk action, kept for reference.
      # Note it references env.CENTOS_VERSION, which this workflow never sets,
      # so it needs fixing before use. Upstream image-template has since moved
      # to 'rpm-ostree compose build-chunked-oci' (and optionally coreos/chunkah)
      # driven from the Justfile, which is the better starting point today:
      # https://github.com/ublue-os/image-template -> 'just ostree-rechunk'
      #
      # You can enable it by uncommenting the following lines:
      # - name: Run Rechunker
      #   id: rechunk
      #   uses: hhd-dev/rechunk@f153348d8100c1f504dec435460a0d7baf11a9d2 # v1.1.1
      #   with:
      #     rechunk: 'ghcr.io/hhd-dev/rechunk:v1.0.1'
      #     ref: "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
      #     skip_compression: true
      #     version: ${{ env.CENTOS_VERSION }}
      #     labels: ${{ steps.metadata.outputs.labels }} # Rechunk strips out all the labels during build, this needs to be reapplied here with newline separator

      # This is necessary so that the podman socket can find the rechunked image on its storage
      # - name: Load in podman and tag
      #   run: |
      #     IMAGE=$(podman pull ${{ steps.rechunk.outputs.ref }})
      #     sudo rm -rf ${{ steps.rechunk.outputs.output }}
      #     for tag in ${{ steps.metadata.outputs.tags }}; do
      #       podman tag $IMAGE ${{ env.IMAGE_NAME }}:$tag
      #     done

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      # Required by the cosign step further down, not just by the push: cosign
      # reads ~/.docker/config.json, which only this action writes.
      # push-to-registry passes --creds straight to podman and persists nothing.
      - name: Login to GitHub Container Registry
        if: steps.should_build_publish.outputs.should_publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: steps.should_build_publish.outputs.should_publish == 'true'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: steps.push.outcome == 'success'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail

          # Every tag resolves to this one manifest, so sign the digest once.
          # Signing per tag would just attach duplicate signatures to the same
          # digest, and re-resolving each tag risks racing a tag that moved.
          #
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Save build input file
        if: steps.push.outcome == 'success'
        env:
          GIT_COMMIT: ${{ steps.current_state.outputs.git_commit }}
          BASE_COMMIT: ${{ steps.current_state.outputs.ostree_commit }}
        run: |
          set -euo pipefail
          jq -n --arg git_commit "$GIT_COMMIT" --arg base_commit "$BASE_COMMIT" \
            '{git_commit: $git_commit, base_commit: $base_commit}' > .last-build-info.json
