---
name: Build laptop container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_image:
    uses: ./.github/workflows/build_reusable.yml
    secrets: inherit
    with:
      image_flavor: laptop
